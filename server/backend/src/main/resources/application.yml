server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: yumai-platform
  datasource:
    url: jdbc:mysql://localhost:3306/yumai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 10000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8
      continue-on-error: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          batch_size: 100
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 1
        max-wait: 2000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 0

yumai:
  jwt:
    secret: YuMaiXinSheng2026GuFengWangLuoYongYuFuNengZhongHuaWenMaiChuanChengPlatformSecretKey
    access-token-hours: 168
    refresh-token-days: 30
  seed:
    enabled: true
  rate-limit:
    default-per-minute: 60
  # 附录五归档根目录：留空则从工作目录逐级向上自动探测「附录五-技术复原」
  archive:
    dir: ""
  # Web 前端根目录：留空则从工作目录逐级向上自动探测「frontend」（需含 index.html）
  web:
    dir: ""

logging:
  level:
    root: INFO
    com.yumai: INFO
    org.hibernate.SQL: WARN
